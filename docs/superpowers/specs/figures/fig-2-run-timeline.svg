11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">75 min</text><text x="318" y="179" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal" dominant-baseline="middle">Runner · judgement ⇄ atonement ×2</text><rect x="691.3076923076924" y="170" width="187.69230769230762" height="18" rx="3" fill="#2a78d6"/><text x="885" y="179" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">40 min</text><text x="318" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal" dominant-baseline="middle">CI · frontend + backend image builds (parallel)</text><rect x="517.6923076923076" y="204" width="131.38461538461547" height="18" rx="3" fill="#eb6834"/><text x="655.0769230769231" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">28 min</text><text x="318" y="247" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal" dominant-baseline="middle">Materialiser · Deploy Commit (mp-&lt;ticket>)</text><rect x="879" y="238" width="28.15384615384619" height="18" rx="3" fill="#1baf7a"/><text x="913.1538461538462" y="247" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">6 min</text><text x="318" y="281" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal" dominant-baseline="middle">Post-back + ledger</text><rect x="907.1538461538462" y="272" width="4.692307692307622" height="18" rx="3" fill="#1baf7a"/><text x="917.8461538461538" y="281" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">1 min</text><rect x="330" y="332" width="12" height="12" rx="2" fill="#2a78d6"/><text x="348" y="338" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">runner (developer’s Protocol)</text><rect x="550" y="332" width="12" height="12" rx="2" fill="#eb6834"/><text x="568" y="338" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">CI image builds</text><rect x="770" y="332" width="12" height="12" rx="2" fill="#1baf7a"/><text x="788" y="338" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">pipeline plumbing</text><text x="24" y="366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">Typical wall-clock ≈ 2 h from message to URL; the environment then lives 72 h unless the PR closes first.</text></svg>