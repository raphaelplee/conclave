4" x2="425" y2="300" stroke="#e1e0d9"/><text x="436.25" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w7</text><line x1="447.5" y1="54" x2="447.5" y2="300" stroke="#e1e0d9"/><text x="458.75" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w8</text><line x1="470" y1="54" x2="470" y2="300" stroke="#e1e0d9"/><text x="481.25" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w9</text><line x1="492.5" y1="54" x2="492.5" y2="300" stroke="#e1e0d9"/><text x="503.75" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w10</text><line x1="515" y1="54" x2="515" y2="300" stroke="#e1e0d9"/><text x="526.25" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w11</text><line x1="537.5" y1="54" x2="537.5" y2="300" stroke="#e1e0d9"/><text x="548.75" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" dominant-baseline="middle">w12</text><line x1="560" y1="54" x2="560" y2="300" stroke="#e1e0d9"/><text x="278" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">0 · Prove it by hand</text><rect x="290" y="69" width="22.5" height="22" rx="3" fill="#2a78d6"/><text x="576" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">first ledger row with measured tokens, minutes and hours</text><text x="278" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">1 · Environment per ticket</text><rect x="312.5" y="109" width="45" height="22" rx="3" fill="#2a78d6"/><text x="576" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">mp-&lt;ticket>.stage… from a manual dispatch; TTL reaps it</text><text x="278" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">2 · The pipeline</text><rect x="335" y="149" width="67.5" height="22" rx="3" fill="#2a78d6"/><text x="576" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">prompt → environment with no hand steps; conclave routine</text><text x="278" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">3 · Intakes + document results</text><rect x="402.5" y="189" width="22.5" height="22" rx="3" fill="#2a78d6"/><text x="576" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">Slack and Jira trigger a run; Confluence page materialiser</text><text x="278" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">4 · Actuals and guardrails</text><rect x="425" y="229" width="45" height="22" rx="3" fill="#2a78d6"/><text x="576" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">OpenCost + Admin API replace the estimates; budgets enforced</text><text x="278" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" dominant-baseline="middle">5 · Wider namespace (gated)</text><rect x="470" y="269" width="90" height="22" rx="3" fill="#86b6ef"/><polygon points="462,280 470,272 478,280 470,288" fill="#eb6834"/><text x="576" y="273" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">gateway, identity, Portal in the namespace; 2nd developer</text><text x="576" y="287" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">runner</text><polygon points="290,324 298,316 306,324 298,332" fill="#eb6834"/><text x="314" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" dominant-baseline="middle">decision gate: Portal ADR 0001/0002 revisit, org repo placement</text><text x="24" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="normal" dominant-baseline="middle">Weeks are calendar weeks at part-time effort (3–5 engineering days for phases 1–2, 5–8 days for phase 5). Exit criteria on the right.</text></svg>